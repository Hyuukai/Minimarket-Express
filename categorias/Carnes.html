<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carnes - Minimarket Express</title>

    <link rel="stylesheet" href="Carnes.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="../principal.html" class="logo">
                <img src="../imagen/logo.png" alt="Logo">
            </a>
        </nav>
    </header>

    <main>

        <section class="CarneDeRes">
            <img src="../imagen/FondoCarne.png" alt="Carnes de res">
            <span>Carnes de Res</span>
        </section>

        <section class="productos">

            <div class="producto">
                <img src="../productos/res/bife chorizo especial.png" alt="Bife de chorizo">
                <h2>Bife de Chorizo</h2>
                <p>Precio: Bs50.00</p>
            </div>

            <div class="producto">
                <img src="../productos/res/bollo grande.png" alt="Bollo Grande de res">
                <h2>Bollo Grande de Res</h2>
                <p>Precio: Bs8.00</p>
            </div>

            <div class="producto">
                <img src="../productos/res/chuleta de lomo.png" alt="Chuleta de lomo de res">
                <h2>Chuleta de Lomo</h2>
                <p>Precio: Bs90.00</p>
            </div>

            <div class="producto">
                <img src="../productos/res/costilla especial.png" alt="Costilla Especial de res">
                <h2>Costilla Especial</h2>
                <p>Precio: Bs95.00</p>
            </div>

            <div class="producto">
                <img src="../productos/res/osobuco.png" alt="Osobuco de res">
                <h2>Osobuco</h2>
                <p>Precio: Bs75.00</p>
            </div>

            <div class="producto">
                <img src="../productos/res/peceto.png" alt="Peceto de res">
                <h2>Peceto</h2>
                <p>Precio: Bs45.00</p>
            </div>

        </section>

    </main>

    <a href="../principal.html" class="volver">
        <button>Volver a la página principal</button>
    </a>

</body>

</html>
